services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas-local
      POSTGRES_DB: atlas
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["atlas-postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  atlas-postgres-data:
